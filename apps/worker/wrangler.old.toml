# TEMPORARY: deploy the "we've moved" broadcast to the OLD foodlog-worker before
# retiring it. Use: wrangler deploy --config wrangler.old.toml
# Delete after the old bot is retired.
name = "foodlog-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "foodlog-db"
database_id = "f0312e67-2fef-47a6-a9ca-59cb9c21a79b"
migrations_dir = "migrations"
